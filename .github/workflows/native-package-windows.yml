name: Native Package (Windows x64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional artifact version override, for example 2.0.12'
        required: false
        type: string
      upload_release:
        description: 'Upload artifacts to the current tag release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
      - 'native-v*'
      - 'gpui-v*'

permissions:
  contents: read

concurrency:
  group: native-package-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate manual release input
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release && inputs.version == ''
        run: python3 -c "import sys; print('Manual release upload requires the version input.', file=sys.stderr); sys.exit(1)"

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: native-package-windows-x64
          cache-on-failure: false

      - name: Install Windows system dependencies
        shell: pwsh
        env:
          NSIS_VERSION: '3.12'
          NSIS_ARCHIVE_SHA256: '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
        run: |
          $archiveName = "nsis-$env:NSIS_VERSION.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $downloadUrl = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/$archiveName"
          curl.exe --fail --location --retry 3 --retry-all-errors `
            --output $archivePath $downloadUrl

          $archiveHash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:NSIS_ARCHIVE_SHA256) {
            throw "NSIS archive checksum mismatch: $archiveHash"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION-portable"
          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          $nsisBin = Join-Path $extractRoot "nsis-$env:NSIS_VERSION"
          if (-not (Test-Path (Join-Path $nsisBin 'makensis.exe'))) {
            throw 'makensis.exe is missing from the verified NSIS archive.'
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7-Zip is missing from the GitHub-hosted Windows runner.'
          }

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
          WINDOWS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERTIFICATE_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; producing an unsigned development artifact.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'oxideterm-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGN_CERTIFICATE_BASE64)
          )
          $certPassword = ConvertTo-SecureString -String $env:WINDOWS_SIGN_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $certPassword
          Remove-Item $certificatePath

      - name: Resolve effective package version
        id: package_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            raw_version="${INPUT_VERSION}"
          else
            raw_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          echo "raw=${raw_version}" >> "$GITHUB_OUTPUT"

      - name: Package native app
        env:
          OXIDETERM_VERSION: ${{ steps.package_version.outputs.raw }}
        run: python scripts/release/package_native.py x86_64-pc-windows-msvc

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $certs = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -like '*OxideTerm*' }
          foreach ($cert in $certs) {
            Remove-Item $cert.PSPath -Force
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: windows-x64-package
          path: |
            dist/*setup.exe
            dist/*portable.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload_release)
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      version: ${{ steps.resolve_tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: windows-x64-package
          path: dist

      - name: Resolve tag and version
        id: resolve_tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate sha256sums
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@72b2db4dacf03be8b5a5c0fb809f927556926c00 # v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: |
            dist/*
          fail_on_unmatched_files: true
